backend:
  name: git-gateway
  branch: main

local_backend: false

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Website Content"
    files:
      - file: "content.json"
        label: "Southern Star Festival — All Content"
        name: "content"
        fields:

          - label: "Website Settings"
            name: "settings"
            widget: "object"
            fields:
              - label: "Main Cover Picture (full-bleed photo background)"
                name: "coverImage"
                widget: "image"
                required: false
                hint: "Optional. A full-bleed photo behind the hero. Leave blank to use the theme's gradient background instead (recommended when using the Hero Logo below, so the logo stays easy to read)."

              - label: "Hero Logo / Main Cover Art"
                name: "heroLogo"
                widget: "image"
                required: false
                hint: "This is the artwork shown front-and-center at the top of the site — currently your Southern Star Festival logo. Swap it for a new version any time by uploading a replacement here."

              - label: "Hero Entrance Animation"
                name: "heroAnimation"
                widget: "select"
                options:
                  - {label: "Pop / Zoom In", value: "pop"}
                  - {label: "Fade Up", value: "fadeUp"}
                  - {label: "Slide In From Left", value: "slideLeft"}
                  - {label: "Flip In", value: "flipIn"}
                  - {label: "None (no animation)", value: "none"}
                default: "pop"
                hint: "How the logo animates in when someone loads the homepage."

              - label: "Animation Speed (seconds)"
                name: "heroAnimationSeconds"
                widget: "number"
                value_type: "float"
                min: 0.3
                max: 4
                default: 1.1
                hint: "Lower = snappier/faster. Higher = slower and more dramatic."

              - label: "Mobile / Social Sharing Picture"
                name: "shareImage"
                widget: "image"
                required: false
                hint: "Optional. Used as the browser-side sharing image. Some social apps cache link previews."

              - label: "Slideshow Time (seconds)"
                name: "slideshowSeconds"
                widget: "number"
                value_type: "int"
                min: 1
                max: 60
                default: 5
                hint: "How many seconds each BBQ slideshow picture stays on screen."

              - label: "Google / SEO (helps your event show up in search results)"
                name: "seo"
                widget: "object"
                collapsed: true
                hint: "Google can show your event with its date, place and ticket prices right in the search results — if it knows the date. Fill in the date below and the site does the rest automatically."
                fields:
                  - {label: "Event date", name: "eventDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: false, required: false, hint: "Pick the day of the festival, including the YEAR. Gates-open / gates-close times are read automatically from your first and last Day-Of Schedule entries. Update this every year."}
                  - {label: "Your website address", name: "siteUrl", widget: "string", required: false, hint: "Example: https://southernstarfestival.com — no slash at the end. Leave blank to use whatever address the site is being viewed at."}
                  - {label: "Organizer name", name: "organizerName", widget: "string", required: false, hint: "Shown to Google as who is putting on the event."}

              - label: "Typography (fonts, sizes & text colors)"
                name: "typography"
                widget: "object"
                collapsed: true
                hint: "Controls every font on the site. 'Title Font' covers headings and labels (lineup, ticket names, schedule times, etc). 'Body Font' covers the longer descriptive text (about paragraphs, ticket descriptions, FAQ answers). 'Base Font' covers navigation, buttons, and prices."
                fields:
                  - {label: "Title Font", name: "titleFont", widget: "select", default: "Lobster", options: ["Lobster","Rye","Bungee","Playfair Display","Oswald","Abril Fatface"]}
                  - {label: "Title Size (% of normal)", name: "titleSize", widget: "number", value_type: "int", min: 60, max: 160, default: 100}
                  - {label: "Title Color (section headings)", name: "titleColor", widget: "color", default: "#ecba4b", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true, hint: "Applies to the big section headings like 'The Lineup' and 'Tickets'."}

                  - {label: "Body / Description Font", name: "bodyFont", widget: "select", default: "Patrick Hand", options: ["Patrick Hand","Kalam","Caveat","Merriweather","Nunito","Georgia"]}
                  - {label: "Body Size (% of normal)", name: "bodySize", widget: "number", value_type: "int", min: 60, max: 160, default: 100}
                  - {label: "Body / Description Text Color", name: "bodyColor", widget: "color", default: "#2f6478", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true, hint: "Applies to all the paragraph-style text: about copy, ticket descriptions, FAQ answers, schedule details, location info."}

                  - {label: "Base / UI Font (nav, buttons, prices)", name: "baseFont", widget: "select", default: "Jost", options: ["Jost","Inter","Poppins","Montserrat","Work Sans","Nunito"]}
                  - {label: "Base Size (% of normal)", name: "baseSize", widget: "number", value_type: "int", min: 60, max: 160, default: 100}

              - label: "Website Colors"
                name: "colors"
                widget: "object"
                collapsed: true
                hint: "Tap any swatch below to open a color picker — drag to pick a shade, or tap a preset square for one of the festival's brand colors. No typing required."
                fields:
                  - {label: "Hero Gradient 1 — Center Glow", name: "sunset1", widget: "color", default: "#e7b854", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Hero Gradient 2", name: "sunset2", widget: "color", default: "#e7b854", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Hero Gradient 3", name: "sunset3", widget: "color", default: "#4AC1DB", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Hero Gradient 4", name: "dusk1", widget: "color", default: "#3EA1B7", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Hero Gradient Outer Edge / Footer Color", name: "dusk2", widget: "color", default: "#3EA1B7", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}

                  - {label: "Gold / Main Accent", name: "gold", widget: "color", default: "#e7b854", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Dark Gold / Button Shadow", name: "goldDeep", widget: "color", default: "#b8842c", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Blue / Secondary Accent — controls the VIP ticket's top border and the cookout box", name: "maroon", widget: "color", default: "#3EA1B7", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Dark Blue Accent", name: "maroonDeep", widget: "color", default: "#3EA1B7", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Teal Accent", name: "teal", widget: "color", default: "#8fd9c4", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}

                  - {label: "Main Background / Cream", name: "cream", widget: "color", default: "#f5ead4", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Alternate Section Background", name: "paper", widget: "color", default: "#efe2c8", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Main Text / Navigation", name: "ink", widget: "color", default: "#2a1c14", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "White / Card Surface", name: "surface", widget: "color", default: "#ffffff", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Slideshow Empty Background", name: "slideshowBg", widget: "color", default: "#000000", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}
                  - {label: "Keyboard Focus Color", name: "focus", widget: "color", default: "#e7b854", colorPresets: ["#e7b854", "#b8842c", "#3EA1B7", "#4AC1DB", "#f5ead4", "#efe2c8", "#2a1c14", "#8fd9c4"], allowInput: true}

                  - {label: "Left Flower Color", name: "flowerLeft", widget: "color", default: "#00000000", enableAlpha: true, allowInput: true, hint: "Slide opacity to 0 to hide this completely."}
                  - {label: "Right Flower Color", name: "flowerRight", widget: "color", default: "#00000000", enableAlpha: true, allowInput: true, hint: "Slide opacity to 0 to hide this completely."}
                  - {label: "Flower Stem Color", name: "stem", widget: "color", default: "#00000000", enableAlpha: true, allowInput: true, hint: "Slide opacity to 0 to hide this completely."}

                  - {label: "Main Shadow", name: "shadow", widget: "color", default: "rgba(60,30,20,0.30)", enableAlpha: true, hint: "Drag the opacity slider for a lighter/heavier shadow."}
                  - {label: "Soft Shadow", name: "shadowSoft", widget: "color", default: "rgba(90,50,30,0.20)", enableAlpha: true}
                  - {label: "Dividers / Borders", name: "divider", widget: "color", default: "rgba(122,46,55,0.20)", enableAlpha: true}
                  - {label: "Hero Text Shadow", name: "heroTextShadow", widget: "color", default: "rgba(0,0,0,0.35)", enableAlpha: true}
                  - {label: "Slideshow Caption Overlay", name: "captionOverlay", widget: "color", default: "rgba(0,0,0,0.75)", enableAlpha: true}
                  - {label: "Inactive Slideshow Dot", name: "dotInactive", widget: "color", default: "rgba(255,255,255,0.50)", enableAlpha: true}
                  - {label: "Cover Photo Overlay — Top", name: "heroOverlayTop", widget: "color", default: "rgba(54,43,70,0.38)", enableAlpha: true}
                  - {label: "Cover Photo Overlay — Bottom", name: "heroOverlayBottom", widget: "color", default: "rgba(54,43,70,0.58)", enableAlpha: true}

          - label: "PAGE LAYOUT — add, remove, hide & reorder sections and tabs"
            name: "pageSections"
            widget: "list"
            hint: "This list IS your website's order, top to bottom (below the logo banner). DRAG a row's handle to move it. Use the X to delete it, or switch 'Show this section' off to hide it without deleting. Use 'Add' to create a brand-new section. Each row also controls the tab name in the top menu. The text inside Lineup, Tickets, FAQ, etc. is still edited in their own panels further down."
            types:
              - label: "Built-in section (About, Lineup, Schedule, BBQ, Tickets, Location, FAQ, Contact)"
                name: "builtin"
                widget: "object"
                summary: "{{fields.navLabel}}"
                fields:
                  - label: "Which section"
                    name: "section"
                    widget: "select"
                    default: "about"
                    options:
                      - {label: "About", value: "about"}
                      - {label: "Lineup", value: "lineup"}
                      - {label: "Day-Of Schedule", value: "schedule"}
                      - {label: "BBQ Cookout (slideshow + video)", value: "bbq"}
                      - {label: "Tickets", value: "tickets"}
                      - {label: "Location & Map", value: "location"}
                      - {label: "FAQ", value: "faq"}
                      - {label: "Contact Us", value: "contact"}
                    hint: "Its words, photos and prices are edited in the matching panel below."
                  - {label: "Tab name (what shows in the top menu)", name: "navLabel", widget: "string"}
                  - {label: "Show a tab for it in the top menu?", name: "showInNav", widget: "boolean", default: true}
                  - {label: "Show this section on the website?", name: "visible", widget: "boolean", default: true}

              - label: "Info section (text + photos)"
                name: "info"
                widget: "object"
                summary: "{{fields.navLabel}}"
                fields:
                  - {label: "Tab name (what shows in the top menu)", name: "navLabel", widget: "string"}
                  - {label: "Show a tab for it in the top menu?", name: "showInNav", widget: "boolean", default: true}
                  - {label: "Show this section on the website?", name: "visible", widget: "boolean", default: true}
                  - label: "Background"
                    name: "background"
                    widget: "select"
                    default: "auto"
                    options:
                      - {label: "Automatic (alternates down the page)", value: "auto"}
                      - {label: "Light", value: "light"}
                      - {label: "Alternate tan", value: "alt"}
                      - {label: "Dark color band", value: "dark"}
                  - {label: "Small heading above the title", name: "kicker", widget: "string", required: false}
                  - {label: "Title", name: "heading", widget: "string"}
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    required: false
                    field: {label: "Paragraph", name: "text", widget: "text"}
                  - label: "Photos (drag in from your computer or phone)"
                    name: "photos"
                    widget: "list"
                    required: false
                    summary: "{{fields.alt}}"
                    fields:
                      - {label: "Photo", name: "img", widget: "image"}
                      - {label: "Short description of the photo (for accessibility)", name: "alt", widget: "string", required: false}
                  - label: "Photos on which side?"
                    name: "photoSide"
                    widget: "select"
                    default: "right"
                    options:
                      - {label: "Right", value: "right"}
                      - {label: "Left", value: "left"}
                  - {label: "Small line of text at the bottom (optional)", name: "footnote", widget: "string", required: false}

              - label: "Text section (centered words + optional button)"
                name: "text"
                widget: "object"
                summary: "{{fields.navLabel}}"
                fields:
                  - {label: "Tab name (what shows in the top menu)", name: "navLabel", widget: "string"}
                  - {label: "Show a tab for it in the top menu?", name: "showInNav", widget: "boolean", default: true}
                  - {label: "Show this section on the website?", name: "visible", widget: "boolean", default: true}
                  - label: "Background"
                    name: "background"
                    widget: "select"
                    default: "auto"
                    options:
                      - {label: "Automatic (alternates down the page)", value: "auto"}
                      - {label: "Light", value: "light"}
                      - {label: "Alternate tan", value: "alt"}
                      - {label: "Dark color band", value: "dark"}
                  - {label: "Small heading above the title", name: "kicker", widget: "string", required: false}
                  - {label: "Title", name: "heading", widget: "string"}
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    required: false
                    field: {label: "Paragraph", name: "text", widget: "text"}
                  - {label: "Button text (optional)", name: "buttonText", widget: "string", required: false}
                  - {label: "Button link (optional — a web address, or #tickets to jump to a section)", name: "buttonLink", widget: "string", required: false}

              - label: "Photo gallery section"
                name: "gallery"
                widget: "object"
                summary: "{{fields.navLabel}}"
                fields:
                  - {label: "Tab name (what shows in the top menu)", name: "navLabel", widget: "string"}
                  - {label: "Show a tab for it in the top menu?", name: "showInNav", widget: "boolean", default: true}
                  - {label: "Show this section on the website?", name: "visible", widget: "boolean", default: true}
                  - label: "Background"
                    name: "background"
                    widget: "select"
                    default: "auto"
                    options:
                      - {label: "Automatic (alternates down the page)", value: "auto"}
                      - {label: "Light", value: "light"}
                      - {label: "Alternate tan", value: "alt"}
                      - {label: "Dark color band", value: "dark"}
                  - {label: "Small heading above the title", name: "kicker", widget: "string", required: false}
                  - {label: "Title", name: "heading", widget: "string"}
                  - {label: "Intro sentence (optional)", name: "intro", widget: "text", required: false}
                  - label: "Photos"
                    name: "photos"
                    widget: "list"
                    summary: "{{fields.caption}}"
                    fields:
                      - {label: "Photo", name: "img", widget: "image"}
                      - {label: "Caption (optional)", name: "caption", widget: "string", required: false}

          - label: "Site Text & Buttons"
            name: "site"
            widget: "object"
            collapsed: true
            hint: "Useful text that used to be hard-coded into index.html."
            fields:
              - {label: "Browser / Search Title", name: "metaTitle", widget: "string", hint: "This is the big blue headline people see on Google. Keep it under about 60 characters and put the festival name first."}
              - {label: "Browser / Search Description", name: "metaDescription", widget: "text", hint: "The gray text under your Google listing. Aim for 120-155 characters: say what it is, the date, the town, and that tickets are available."}
              - {label: "Home Tab Name (first tab in the top menu)", name: "homeNavLabel", widget: "string", required: false}

              - {label: "Hero Primary Button", name: "heroPrimaryButton", widget: "string"}
              - {label: "Hero Secondary Button", name: "heroSecondaryButton", widget: "string"}

              - {label: "Lineup Small Heading", name: "lineupKicker", widget: "string"}
              - {label: "Lineup Main Heading", name: "lineupTitle", widget: "string"}

              - {label: "Schedule Small Heading", name: "scheduleKicker", widget: "string", required: false, hint: "Leave blank to automatically use the festival date and venue."}
              - {label: "Schedule Main Heading", name: "scheduleTitle", widget: "string"}

              - {label: "BBQ Small Heading", name: "bbqKicker", widget: "string"}
              - {label: "BBQ Main Heading", name: "bbqTitle", widget: "string"}

              - {label: "Tickets Small Heading", name: "ticketsKicker", widget: "string"}
              - {label: "Tickets Main Heading", name: "ticketsTitle", widget: "string"}
              - {label: "Note under the Big Ticket Box (e.g. ID reminder)", name: "checkoutNote", widget: "string", required: false}
              - {label: "Big Ticket Box: Heading", name: "buyHeading", widget: "string", required: false, default: "Ready to join us?"}
              - {label: "Big Ticket Box: Message", name: "buyText", widget: "text", required: false}
              - {label: "Big Ticket Box: Button Text", name: "buyButton", widget: "string", required: false, default: "Get Tickets"}
              - label: "Big Ticket Box: Little Selling Points (3 look best)"
                name: "buyPerks"
                widget: "list"
                required: false
                field: {label: "Selling point", name: "perk", widget: "string"}

              - {label: "FAQ Small Heading", name: "faqKicker", widget: "string"}
              - {label: "FAQ Main Heading", name: "faqTitle", widget: "string"}

              - {label: "Directions Button Text", name: "directionsButtonText", widget: "string"}
              - {label: "Footer Festival Name", name: "footerName", widget: "string"}

          - label: "Hero (top banner)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Presented-by line", name: "presents", widget: "string"}
              - {label: "Festival name", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Venue name", name: "venue", widget: "string"}
              - {label: "City/State", name: "city", widget: "string"}

          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - {label: "Small headline above the paragraph", name: "kicker", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "text", widget: "text"}
              - label: "Stats row"
                name: "stats"
                widget: "list"
                fields:
                  - {label: "Number/word", name: "value", widget: "string"}
                  - {label: "Label underneath", name: "label", widget: "string"}
              - {label: "Photo", name: "photo", widget: "image"}

          - label: "Lineup Slots"
            name: "lineup"
            widget: "list"
            summary: "{{slot}} — {{name}}"
            fields:
              - {label: "Slot", name: "slot", widget: "string"}
              - {label: "Artist name", name: "name", widget: "string"}

          - {label: "Note under the lineup grid", name: "lineupNote", widget: "string"}

          - label: "Day-Of Schedule"
            name: "schedule"
            widget: "list"
            summary: "{{time}} — {{title}}"
            fields:
              - {label: "Time", name: "time", widget: "string"}
              - {label: "What's happening", name: "title", widget: "string"}
              - {label: "Details", name: "desc", widget: "string"}

          - label: "BBQ Cook-Off Section"
            name: "bbq"
            widget: "object"
            fields:
              - label: "Slideshow photos"
                name: "slides"
                widget: "list"
                summary: "{{caption}}"
                hint: "The live website now shows exactly the photos in this list — deleted photos will no longer linger."
                fields:
                  - {label: "Photo", name: "img", widget: "image"}
                  - {label: "Caption", name: "caption", widget: "string"}
              - {label: "YouTube video ID (the part after watch?v=)", name: "videoId", widget: "string"}
              - {label: "Cook-off box title", name: "cookoffTitle", widget: "string"}
              - {label: "Cook-off box text", name: "cookoffText", widget: "text"}

          - label: "Tickets"
            name: "tickets"
            widget: "list"
            summary: "{{name}} — {{price}}"
            fields:
              - {label: "Ticket name", name: "name", widget: "string"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Unit", name: "unit", widget: "string", required: false}
              - {label: "Description", name: "desc", widget: "text"}
              - {label: "Button text", name: "cta", widget: "string"}
              - {label: "Ribbon on top (e.g. Most Popular)", name: "badge", widget: "string", required: false}
              - {label: "Highlight this card (VIP-style)?", name: "featured", widget: "boolean", default: false}

          - label: "Ticket Checkout (Universe)"
            name: "universe"
            widget: "object"
            fields:
              - label: "Universe event link"
                name: "eventUrl"
                widget: "string"
                required: false
                hint: "Your Universe event page link. Leave blank to use the built-in Southern Star link. Every ticket button opens checkout for this event."
              - label: "Ticket button color (inside the checkout pop-up)"
                name: "checkoutColor"
                widget: "color"
                required: false
                default: "#237486"
              - label: "Advanced: show a pasted Universe widget instead?"
                name: "useEmbed"
                widget: "boolean"
                default: false
                required: false
                hint: "Leave OFF for the pretty ticket cards. Only turn on if you want the plain Universe widget shown too."
              - label: "Advanced: Universe widget embed code"
                name: "embedCode"
                widget: "text"
                required: false
                hint: "Only used when the switch above is ON."
              - label: "Fee note under the checkout"
                name: "feeNote"
                widget: "text"
                required: false

          - label: "Location"
            name: "location"
            widget: "object"
            fields:
              - {label: "Venue name", name: "title", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "text", widget: "text"}
              - {label: "Map address / search text", name: "mapQuery", widget: "string", hint: "This now controls both the map and the Get Directions button."}

          - label: "FAQ"
            name: "faq"
            widget: "list"
            summary: "{{q}}"
            fields:
              - {label: "Question", name: "q", widget: "string"}
              - {label: "Answer", name: "a", widget: "text"}

          - label: "Social Media Links"
            name: "socials"
            widget: "list"
            required: false
            summary: "{{label}}"
            hint: "Add, delete, and reorder links. Only links with both a name and a web address appear in the footer. ICONS APPEAR AUTOMATICALLY for Instagram, Facebook, TikTok, YouTube, X/Twitter, Spotify, Threads, Bluesky, Apple Music, SoundCloud and Pinterest — just paste the link. For an email icon use mailto:you@example.com. Any other site shows as a text button."
            fields:
              - {label: "Platform / Link Name", name: "label", widget: "string", hint: "Examples: Instagram, Facebook, TikTok, YouTube"}
              - {label: "Full URL", name: "url", widget: "string", hint: "Example: https://instagram.com/yourpage"}

          - label: "Contact Us"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Small heading", name: "kicker", widget: "string", required: false}
              - {label: "Main heading", name: "title", widget: "string"}
              - {label: "Line above the email", name: "emailLabel", widget: "string", required: false}
              - {label: "Email address", name: "email", widget: "string", required: false}
              - label: "Contact buttons (add, remove, reorder)"
                name: "cards"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Short description", name: "desc", widget: "text", required: false}
                  - {label: "Button text", name: "button", widget: "string"}
                  - {label: "Link", name: "link", widget: "string", hint: "A web address (https://...), or mailto:you@example.com. For a file on this site use /sponsor-deck.pdf"}

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Tagline under the festival name", name: "tagline", widget: "string"}
              - {label: "Fine print", name: "note", widget: "text"}
