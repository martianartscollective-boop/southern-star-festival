<style>
  :root{
    /* ---- Southern Star Festival colors, sampled from the logo artwork ---- */
    --sunset-1:#e7b854; --sunset-2:#e7b854; --sunset-3:#4AC1DB;
    --dusk-1:#3EA1B7; --dusk-2:#3EA1B7;
    --gold:#e7b854; --gold-deep:#b8842c;
    --cream:#f5ead4; --paper:#efe2c8;
    --maroon:#3EA1B7; --maroon-deep:#3EA1B7;
    --teal:#8fd9c4; --ink:#2a1c14; --ink-soft:#4a3527; --focus:#e7b854;
    --surface:#ffffff; --slideshow-bg:#000000;
    --flower-left:#00000000; --flower-right:#00000000; --stem:#00000000;
    --shadow:rgba(60,30,20,0.30); --shadow-soft:rgba(90,50,30,0.20);
    --divider:rgba(122,46,55,0.20);
    --hero-text-shadow:rgba(0,0,0,0.35);
    --caption-overlay:rgba(0,0,0,0.75);
    --dot-inactive:rgba(255,255,255,0.50);
    --hero-overlay-top:rgba(54,43,70,0.38);
    --hero-overlay-bottom:rgba(54,43,70,0.58);

    /* ---- Typography system — all editable from /admin ---- */
    --font-title:'Lobster', cursive;
    --font-body:'Patrick Hand', cursive;
    --font-base:'Jost', sans-serif;
    --title-scale:1; --body-scale:1; --base-scale:1;
    --title-color:#e7b854;

    /* ---- Hero entrance animation ---- */
    --hero-anim-duration:1.1s;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:var(--font-base);font-size:calc(1rem * var(--base-scale));color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0;} p{margin:0;} a{color:inherit;} img{max-width:100%;display:block;}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .display{font-family:var(--font-title);}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .tabnav{position:sticky;top:0;z-index:50;background:var(--ink);border-bottom:3px solid var(--gold);overflow-x:auto;scrollbar-width:none;}
  .tabnav::-webkit-scrollbar{display:none;}
  .tabnav-inner{display:flex;min-width:max-content;padding:0 12px;}
  .tabnav a{text-decoration:none;color:var(--cream);font-family:var(--font-base);font-size:calc(0.95rem * var(--base-scale));font-weight:500;padding:16px 18px;white-space:nowrap;border-bottom:3px solid transparent;transition:color .2s ease, border-color .2s ease;}
  .tabnav a:hover{color:var(--gold);}
  .tabnav a.active{color:var(--gold);border-color:var(--gold);}

  .hero{position:relative;overflow:hidden;padding:76px 20px 90px;background:radial-gradient(circle at 50% 18%, var(--sunset-1) 0%, var(--sunset-2) 32%, var(--sunset-3) 58%, var(--dusk-1) 78%, var(--dusk-2) 100%);background-size:cover;background-position:center;background-repeat:no-repeat;text-align:center;color:var(--cream);}
  .rays{position:absolute;inset:0;background-image:repeating-conic-gradient(from 0deg at 50% 20%, rgba(245,234,212,0.10) 0deg 9deg, transparent 9deg 18deg);opacity:0.55;pointer-events:none;}
  .hero-content{position:relative;z-index:2;max-width:900px;margin:0 auto;}
  .presents{font-size:calc(0.85rem * var(--base-scale));letter-spacing:0.04em;color:var(--cream);opacity:0.95;margin-bottom:22px;text-shadow:0 1px 6px var(--hero-text-shadow);}
  .hero-logo{width:100%;max-width:min(560px,92%);margin:0 auto 26px;border-radius:12px;box-shadow:0 20px 44px var(--hero-text-shadow);animation-duration:var(--hero-anim-duration);animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1);}
  .hero-logo.anim-pop{animation-name:heroPop;}
  .hero-logo.anim-fadeUp{animation-name:heroFadeUp;}
  .hero-logo.anim-slideLeft{animation-name:heroSlideLeft;}
  .hero-logo.anim-flipIn{animation-name:heroFlipIn;}
  .hero-logo.anim-none{animation:none;}
  @keyframes heroPop{
    0%{transform:scale(0.35) rotate(-8deg);opacity:0;}
    65%{transform:scale(1.08) rotate(2deg);opacity:1;}
    100%{transform:scale(1) rotate(0deg);opacity:1;}
  }
  @keyframes heroFadeUp{
    0%{transform:translateY(44px);opacity:0;}
    100%{transform:translateY(0);opacity:1;}
  }
  @keyframes heroSlideLeft{
    0%{transform:translateX(-70px);opacity:0;}
    100%{transform:translateX(0);opacity:1;}
  }
  @keyframes heroFlipIn{
    0%{transform:perspective(700px) rotateX(75deg);opacity:0;}
    100%{transform:perspective(700px) rotateX(0deg);opacity:1;}
  }
  .hero-meta{font-size:calc(1.05rem * var(--base-scale));font-weight:600;letter-spacing:0.02em;margin-bottom:34px;text-shadow:0 1px 6px var(--hero-text-shadow);}
  .hero-meta .dot{color:var(--gold);margin:0 10px;}
  .btn{display:inline-block;font-family:var(--font-base);font-weight:600;font-size:calc(1rem * var(--base-scale));padding:15px 34px;border-radius:3px;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--gold);color:var(--ink);box-shadow:0 6px 0 var(--gold-deep);}
  .btn-primary:hover{box-shadow:0 8px 0 var(--gold-deep);}
  .btn-primary:active{transform:translateY(2px);box-shadow:0 3px 0 var(--gold-deep);}
  .btn-outline{background:transparent;border-color:var(--cream);color:var(--cream);}
  .bloom{position:absolute;bottom:-10px;width:150px;opacity:0.9;}
  .bloom.left{left:-10px;} .bloom.right{right:-10px;transform:scaleX(-1);}

  section{padding:72px 20px;}
  .section-inner{max-width:1080px;margin:0 auto;}
  .section-head{margin-bottom:36px;text-align:center;}
  .section-head .display{font-size:calc(clamp(1.8rem,4vw,2.6rem) * var(--title-scale));color:var(--title-color);}
  .section-head .kicker{display:block;font-family:var(--font-base);font-size:calc(0.95rem * var(--base-scale));color:var(--gold-deep);font-weight:600;margin-bottom:6px;}
  .section-alt{background:var(--paper);}

  .about-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:48px;align-items:center;}
  .about-text p{margin-bottom:16px;line-height:1.7;font-family:var(--font-body);color:var(--ink-soft);font-size:calc(1.1rem * var(--body-scale));}
  .about-kicker{display:block;font-family:var(--font-title);font-size:calc(1.6rem * var(--title-scale));color:var(--title-color);margin-bottom:14px;}
  .stat-row{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap;}
  .stat{min-width:110px;}
  .stat b{display:block;font-family:var(--font-title);font-size:calc(1.8rem * var(--title-scale));color:var(--maroon);}
  .stat span{font-family:var(--font-base);font-size:calc(0.9rem * var(--base-scale));color:var(--ink-soft);}
  .about-photo{border-radius:6px;overflow:hidden;box-shadow:0 14px 30px var(--shadow-soft);border:6px solid var(--cream);transform:rotate(-1.5deg);}

  .lineup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;}
  .lineup-card{background:var(--ink);color:var(--cream);border-radius:6px;padding:30px 20px;text-align:center;border:2px dashed var(--gold);}
  .lineup-card .slot{font-family:var(--font-base);font-size:calc(0.8rem * var(--base-scale));letter-spacing:0.03em;color:var(--gold);margin-bottom:10px;font-weight:600;}
  .lineup-card .tba{font-family:var(--font-title);font-size:calc(1.3rem * var(--title-scale));}
  .lineup-note{text-align:center;margin-top:26px;font-family:var(--font-body);color:var(--ink-soft);font-size:calc(1rem * var(--body-scale));}

  .schedule-list{max-width:640px;margin:0 auto;}
  .schedule-item{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--divider);}
  .schedule-item:last-child{border-bottom:none;}
  .schedule-time{font-family:var(--font-title);color:var(--maroon);font-size:calc(1.05rem * var(--title-scale));}
  .schedule-what b{display:block;margin-bottom:2px;font-family:var(--font-base);font-size:calc(1rem * var(--base-scale));}
  .schedule-what span{font-family:var(--font-body);color:var(--ink-soft);font-size:calc(1rem * var(--body-scale));}

  .about-video{border-radius:8px;overflow:hidden;box-shadow:0 16px 34px var(--shadow);aspect-ratio:16/9;border:6px solid var(--cream);background:#000;}
  .about-video iframe,.about-video video{width:100%;height:100%;border:0;display:block;}
  .about-video video{object-fit:contain;background:#000;}
  .cookoff-badge{background:var(--maroon);color:var(--cream);border-radius:6px;padding:20px 22px;}
  .cookoff-badge b{display:block;font-family:var(--font-title);font-size:calc(1.2rem * var(--title-scale));margin-bottom:6px;color:var(--gold);}
  .cookoff-badge p{color:var(--cream);font-family:var(--font-body);opacity:0.95;font-size:calc(1.05rem * var(--body-scale));line-height:1.6;}

  #tickets{--notch-bg:var(--cream);}
  #tickets.section-alt{--notch-bg:var(--paper);}
  .ticket-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px;align-items:stretch;margin-bottom:46px;}
  .ticket-card{position:relative;background:var(--surface);border-radius:12px;box-shadow:0 12px 28px var(--shadow-soft);display:flex;flex-direction:column;border-top:6px solid var(--gold);transition:transform .2s ease, box-shadow .2s ease;}
  .ticket-card:hover{transform:translateY(-4px);box-shadow:0 18px 34px var(--shadow-soft);}
  .ticket-card.featured{background:var(--ink);color:var(--cream);border-top-color:var(--maroon);transform:translateY(-8px);box-shadow:0 18px 38px var(--shadow);}
  .ticket-card.featured:hover{transform:translateY(-12px);}
  .ticket-badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-family:var(--font-base);font-weight:700;font-size:calc(0.78rem * var(--base-scale));letter-spacing:.06em;text-transform:uppercase;padding:5px 14px;border-radius:999px;box-shadow:0 3px 0 var(--gold-deep);white-space:nowrap;}
  .ticket-main{padding:30px 26px 22px;flex-grow:1;}
  .ticket-name{font-family:var(--font-title);font-size:calc(1.4rem * var(--title-scale));color:var(--maroon);margin-bottom:10px;line-height:1.2;}
  .ticket-card.featured .ticket-name{color:var(--gold);}
  .ticket-desc{font-family:var(--font-body);color:var(--ink-soft);font-size:calc(1.05rem * var(--body-scale));line-height:1.6;}
  .ticket-card.featured .ticket-desc{color:rgba(245,234,212,0.88);}
  .ticket-stub{position:relative;border-top:2px dashed var(--divider);padding:24px 26px 26px;text-align:center;}
  .ticket-card.featured .ticket-stub{border-top-color:rgba(231,184,84,.5);}
  .ticket-stub::before,.ticket-stub::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--notch-bg);}
  .ticket-stub::before{left:-12px;}
  .ticket-stub::after{right:-12px;}
  .ticket-price{font-family:var(--font-base);font-size:calc(2.6rem * var(--base-scale));font-weight:700;color:var(--maroon);line-height:1;margin-bottom:16px;}
  .ticket-price span{font-size:calc(0.95rem * var(--base-scale));font-weight:400;opacity:.8;}
  .ticket-card.featured .ticket-price{color:var(--gold);}
  .ticket-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;background:var(--gold);color:var(--ink);font-family:var(--font-base);font-weight:700;font-size:calc(1.05rem * var(--base-scale));text-decoration:none;padding:14px 18px;border-radius:999px;box-shadow:0 5px 0 var(--gold-deep);transition:transform .15s ease, box-shadow .15s ease;}
  .ticket-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--gold-deep);}
  .ticket-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-deep);}
  .ticket-btn.disabled,.btn-buy.disabled{opacity:.55;pointer-events:none;}
  .ticket-btn svg,.btn-buy svg{width:1.3em;height:1.3em;flex:none;}

  .buy-band{position:relative;overflow:hidden;background:var(--ink);color:var(--cream);border-radius:16px;padding:54px 28px 40px;text-align:center;box-shadow:0 18px 40px var(--shadow);background-image:repeating-conic-gradient(from 0deg at 50% 120%, rgba(231,184,84,.10) 0deg 6deg, transparent 6deg 14deg);}
  .buy-band h3{font-family:var(--font-title);font-weight:400;font-size:calc(2.4rem * var(--title-scale));color:var(--gold);margin:0 0 10px;line-height:1.15;}
  .buy-band p.buy-text{font-family:var(--font-body);font-size:calc(1.2rem * var(--body-scale));line-height:1.6;max-width:560px;margin:0 auto 28px;color:rgba(245,234,212,.92);}
  .btn-buy{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--gold);color:var(--ink);font-family:var(--font-base);font-weight:700;font-size:calc(1.35rem * var(--base-scale));text-decoration:none;padding:20px 46px;border-radius:999px;box-shadow:0 8px 0 var(--gold-deep), 0 16px 30px rgba(0,0,0,.35);transition:transform .15s ease, box-shadow .15s ease;}
  .btn-buy:hover{transform:translateY(-3px);box-shadow:0 11px 0 var(--gold-deep), 0 20px 34px rgba(0,0,0,.4);}
  .btn-buy:active{transform:translateY(4px);box-shadow:0 3px 0 var(--gold-deep);}
  .buy-perks{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 30px;font-family:var(--font-base);font-size:calc(.95rem * var(--base-scale));color:rgba(245,234,212,.9);}
  .buy-perks li{display:flex;align-items:center;gap:8px;}
  .buy-perks svg{width:1.25em;height:1.25em;color:var(--gold);flex:none;}
  .buy-band .buy-note{color:var(--gold);margin:22px auto 0;font-weight:600;}
  .buy-band .powered-by{color:var(--cream);margin-top:24px;}
  @media (max-width:600px){.buy-band{padding:40px 18px 30px;}.btn-buy{width:100%;box-sizing:border-box;padding:18px 20px;}.ticket-card.featured{transform:none;}}
  .contact-email{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;max-width:720px;margin:0 auto 38px;background:var(--ink);color:var(--cream);border-radius:16px;padding:26px 24px;text-align:center;box-shadow:0 14px 30px var(--shadow-soft);}
  .contact-email .ce-label{font-family:var(--font-body);font-size:calc(1.1rem * var(--body-scale));width:100%;color:rgba(245,234,212,.9);}
  .contact-email a{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-title);font-size:calc(1.7rem * var(--title-scale));color:var(--gold);text-decoration:none;word-break:break-all;}
  .contact-email a:hover{text-decoration:underline;}
  .contact-email svg{width:1.2em;height:1.2em;flex:none;}
  .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;max-width:1000px;margin:0 auto;}
  .contact-card{background:var(--surface);border-radius:12px;border-top:6px solid var(--gold);box-shadow:0 12px 28px var(--shadow-soft);padding:30px 26px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .2s ease;}
  .contact-card:hover{transform:translateY(-4px);}
  .cc-icon{width:62px;height:62px;border-radius:50%;background:var(--maroon);color:var(--cream);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .cc-icon svg{width:30px;height:30px;}
  .contact-card h3{font-family:var(--font-title);font-weight:400;font-size:calc(1.4rem * var(--title-scale));color:var(--maroon);margin:0 0 8px;line-height:1.2;}
  .contact-card p{font-family:var(--font-body);color:var(--ink-soft);font-size:calc(1.05rem * var(--body-scale));line-height:1.6;margin:0 0 22px;flex-grow:1;}
  .contact-card .ticket-btn{width:auto;padding:13px 28px;}
  .checkout-note{text-align:center;max-width:640px;margin:0 auto 30px;font-family:var(--font-body);color:var(--ink-soft);font-size:calc(1rem * var(--body-scale));line-height:1.6;}
  .checkout-note a{color:var(--maroon);font-weight:600;text-decoration:underline;}
  .checkout-wrap{max-width:720px;margin:0 auto;border-radius:8px;overflow:hidden;box-shadow:0 14px 30px var(--shadow-soft);border:1px solid var(--divider);}
  .checkout-frame{position:relative;overflow:hidden;height:900px;width:100%;background:var(--surface);}
  .checkout-frame iframe{position:absolute;border:0;top:0;left:0;bottom:0;right:0;width:100%;height:100%;}
  .checkout-fallback{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 24px;text-align:center;font-family:var(--font-body);color:var(--ink-soft);}
  .checkout-fallback b{font-family:var(--font-title);color:var(--maroon);font-size:calc(1.2rem * var(--title-scale));}
  .checkout-fallback p{font-size:calc(1.05rem * var(--body-scale));}
  .powered-by{text-align:center;font-family:var(--font-base);font-size:calc(0.82rem * var(--base-scale));color:var(--ink-soft);opacity:0.8;margin-top:10px;}

  .location-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;}
  .location-info b{display:block;font-family:var(--font-title);font-size:calc(1.25rem * var(--title-scale));color:var(--maroon);margin-bottom:8px;}
  .location-info p{font-family:var(--font-body);color:var(--ink-soft);line-height:1.7;font-size:calc(1.05rem * var(--body-scale));margin-bottom:18px;}
  .map-frame{border-radius:8px;overflow:hidden;box-shadow:0 14px 30px var(--shadow-soft);aspect-ratio:4/3;}
  .map-frame iframe{width:100%;height:100%;border:0;}

  .faq-list{max-width:720px;margin:0 auto;}
  .faq-item{border-bottom:1px solid var(--divider);}
  .faq-q{width:100%;text-align:left;background:none;border:none;font-family:var(--font-base);font-size:calc(1.05rem * var(--base-scale));font-weight:600;color:var(--ink);padding:20px 6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;}
  .faq-q .icon{font-family:var(--font-title);color:var(--maroon);font-size:calc(1.3rem * var(--title-scale));transition:transform .2s ease;}
  .faq-item.open .icon{transform:rotate(45deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;font-family:var(--font-body);color:var(--ink-soft);line-height:1.7;font-size:calc(1.05rem * var(--body-scale));padding:0 6px;}
  .faq-item.open .faq-a{padding-bottom:20px;}

  footer{background:var(--dusk-2);color:var(--cream);padding:44px 20px 30px;text-align:center;}
  footer .display{color:var(--gold);font-size:calc(1.5rem * var(--title-scale));margin-bottom:10px;}
  footer .foot-links{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:18px 0;font-family:var(--font-base);font-size:calc(0.9rem * var(--base-scale));}
  footer .foot-links a{text-decoration:none;opacity:0.85;}
  footer .foot-links a:hover{opacity:1;color:var(--gold);}
  footer .social-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px;}

<script>

  function esc(s){
    return (s ?? '').toString().replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[ch]);
  }

  function safeExternalUrl(value){
    if(!value) return '#';
    try{
      const url = new URL(value, window.location.origin);
      return ['http:', 'https:', 'mailto:'].includes(url.protocol) ? url.href : '#';
    }catch(e){
      return '#';
    }
  }

  // Links: "#section" stays on the page; everything else must be http(s)/mailto.
  function safeLink(value){
    const v = (value || '').toString().trim();
    if(v.startsWith('#')) return v;
    return safeExternalUrl(v);
  }

  // ---------- Page layout: the ordered list of sections/tabs, controlled from /admin ----------
  const BUILTIN_LABELS = {
    about:'About', lineup:'Lineup', schedule:'Schedule',
    tickets:'Tickets', location:'Location', faq:'FAQ', contact:'Contact'
  };
  const DEFAULT_LAYOUT = Object.keys(BUILTIN_LABELS).map(k => (
    {type:'builtin', section:k, navLabel:BUILTIN_LABELS[k], showInNav:true, visible:true}
  ));

  function slugify(s){
    const base = (s || '').toString().toLowerCase().replace(/&/g,' and ')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    return base || 'section';
  }

  function paragraphsHtml(list){
    return (list || [])
      .map(p => (typeof p === 'string') ? p : (p && p.text) || '')
      .filter(Boolean)
      .map(p => `<p>${esc(p)}</p>`).join('');
  }

  // Builds one custom section (Info / Text / Gallery) from its admin entry.
  function buildCustomSection(item, id){
    const sec = document.createElement('section');
    sec.id = id;
    sec.setAttribute('data-custom', '1');
    const kicker = item.kicker ? `<span class="kicker">${esc(item.kicker)}</span>` : '';
    const heading = item.heading ? `<h2 class="display">${esc(item.heading)}</h2>` : '';

    if(item.type === 'info'){
      const photos = (item.photos || []).filter(p => p && p.img);
      const cls = 'cs-info' + (item.photoSide === 'left' ? ' photos-left' : '') + (photos.length ? '' : ' solo');
      sec.innerHTML = `
        <div class="section-inner ${cls}">
          <div class="cs-text">
            ${item.kicker ? `<span class="cs-kicker">${esc(item.kicker)}</span>` : ''}
            ${item.heading ? `<h2 class="display cs-heading">${esc(item.heading)}</h2>` : ''}
            ${paragraphsHtml(item.paragraphs)}
          </div>
          ${photos.length ? `<div class="cs-photos">${photos.map(p =>
            `<img src="${esc(p.img)}" alt="${esc(p.alt || item.heading || '')}" loading="lazy">`).join('')}</div>` : ''}
        </div>
        ${item.footnote ? `<div class="section-inner"><p class="cs-footnote">${esc(item.footnote)}</p></div>` : ''}`;
    } else if(item.type === 'gallery'){
      const photos = (item.photos || []).filter(p => p && p.img);
      sec.innerHTML = `
        <div class="section-inner">
          <div class="section-head">${kicker}${heading}</div>
          ${item.intro ? `<div class="cs-body">${paragraphsHtml([item.intro])}</div>` : ''}
          <div class="cs-gallery">${photos.map(p => `<figure><img src="${esc(p.img)}" alt="${esc(p.caption || '')}" loading="lazy">${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ''}</figure>`).join('')}</div>
        </div>`;
    } else { // 'text'
      const link = safeLink(item.buttonLink);
      const external = !link.startsWith('#');
      sec.innerHTML = `
        <div class="section-inner cs-textblock">
          <div class="section-head">${kicker}${heading}</div>
          <div class="cs-body">${paragraphsHtml(item.paragraphs)}</div>
          ${item.buttonText && item.buttonLink ? `<a class="btn btn-primary" href="${esc(link)}"${external ? ' target="_blank" rel="noopener noreferrer"' : ''}>${esc(item.buttonText)}</a>` : ''}
        </div>`;
    }
    return sec;
  }

  // Orders, hides, labels and colors every section based on data.pageSections.
  function buildLayout(data, site){
    const main = document.getElementById('sections');
    main.querySelectorAll('[data-custom]').forEach(n => n.remove());
    const items = (Array.isArray(data.pageSections) && data.pageSections.length) ? data.pageSections : DEFAULT_LAYOUT;

    const used = new Set(['home','sections','tabnav','tabnavInner', ...Object.keys(BUILTIN_LABELS)]);
    const placed = new Set();
    const visibleNodes = [];
    const tabs = [{id:'home', label: site.homeNavLabel || 'Home'}];

    items.forEach(item => {
      if(!item) return;
      let node, id, label = (item.navLabel || '').trim();
      if(item.type === 'builtin'){
        id = item.section;
        if(!BUILTIN_LABELS[id] || placed.has(id)) return;   // unknown or duplicate entry
        node = document.getElementById(id);
        if(!node) return;
        placed.add(id);
        label = label || BUILTIN_LABELS[id];
      }else{
        const base = slugify(item.navLabel || item.heading);
        id = base; let n = 2;
        while(used.has(id)) id = base + '-' + (n++);
        used.add(id);
        node = buildCustomSection(item, id);
        label = label || item.heading || 'Section';
      }
      main.appendChild(node);
      const show = item.visible !== false;
      node.hidden = !show;
      if(show){
        visibleNodes.push({node, item});
        if(item.showInNav !== false) tabs.push({id, label});
      }
    });

    // Built-in sections that were deleted from the list are simply hidden.
    Object.keys(BUILTIN_LABELS).forEach(id => {
      if(!placed.has(id)){
        const n = document.getElementById(id);
        if(n){ n.hidden = true; main.appendChild(n); }
      }
    });

    // Alternate the background down the page (custom sections may pick their own).
    visibleNodes.forEach(({node, item}, i) => {
      node.classList.remove('section-alt', 'cs-dark');
      const bg = item.type === 'builtin' ? 'auto' : (item.background || 'auto');
      if(bg === 'alt' || (bg === 'auto' && i % 2 === 1)) node.classList.add('section-alt');
      else if(bg === 'dark') node.classList.add('cs-dark');
    });

    return { tabs, visible: new Set(visibleNodes.map(v => v.node.id)) };
  }

  function socialKey(link){
    const url = (link.url || '').trim();
    if(/^mailto:/i.test(url)) return 'email';
    try{
      const host = new URL(url).hostname.toLowerCase().replace(/^www\./, '');
      for(const h in SOCIAL_HOSTS){ if(host === h || host.endsWith('.' + h)) return SOCIAL_HOSTS[h]; }
    }catch(e){}
    return SOCIAL_NAMES[(link.label || '').trim().toLowerCase()] || null;
  }

    const target = isMail ? '' : ' target="_blank" rel="noopener noreferrer"';
    if(key && SOCIAL_ICONS[key]){
      return `<a href="${href}"${target} aria-label="${name}" title="${name}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${SOCIAL_ICONS[key]}"/></svg><span class="sr-only">${name}</span></a>`;

    // Apply the Admin-controlled theme palette.
    const colorMap = {
      sunset1:'--sunset-1', sunset2:'--sunset-2', sunset3:'--sunset-3',
      dusk1:'--dusk-1', dusk2:'--dusk-2',
      gold:'--gold', goldDeep:'--gold-deep',
      cream:'--cream', paper:'--paper',
      maroon:'--maroon', maroonDeep:'--maroon-deep',
      teal:'--teal', ink:'--ink', focus:'--focus',
      surface:'--surface', slideshowBg:'--slideshow-bg',
      flowerLeft:'--flower-left', flowerRight:'--flower-right', stem:'--stem',
      shadow:'--shadow', shadowSoft:'--shadow-soft', divider:'--divider',
      heroTextShadow:'--hero-text-shadow', captionOverlay:'--caption-overlay',
      dotInactive:'--dot-inactive',
      heroOverlayTop:'--hero-overlay-top', heroOverlayBottom:'--hero-overlay-bottom'
    };
    Object.entries(colorMap).forEach(([key, cssVar]) => {
      if(colors[key]) document.documentElement.style.setProperty(cssVar, colors[key]);
    });

    // Apply the Admin-controlled typography system (font family, size, color).
    const root = document.documentElement.style;
    root.setProperty('--font-title', `"${typo.titleFont || 'Lobster'}", cursive`);
    root.setProperty('--font-body', `"${typo.bodyFont || 'Patrick Hand'}", cursive`);
    root.setProperty('--font-base', `"${typo.baseFont || 'Jost'}", sans-serif`);
    root.setProperty('--title-scale', String((Number(typo.titleSize) || 100) / 100));
    root.setProperty('--body-scale', String((Number(typo.bodySize) || 100) / 100));
    root.setProperty('--base-scale', String((Number(typo.baseSize) || 100) / 100));
    if(typo.titleColor) root.setProperty('--title-color', typo.titleColor);
    if(typo.bodyColor) root.setProperty('--ink-soft', typo.bodyColor);

    // Page layout: order, visibility and tab names come from the admin "Page Layout" list.
    const layout = buildLayout(data, site);
    document.getElementById('tabnavInner').innerHTML = layout.tabs.map((t, i) =>
      `<a href="#${esc(t.id)}"${i === 0 ? ' class="active"' : ''}>${esc(t.label)}</a>`).join('');

    // Site title / description.
    if(site.metaTitle) document.title = site.metaTitle;
    const description = document.querySelector('meta[name="description"]');
    const ogTitle = document.querySelector('meta[property="og:title"]');
    const ogDescription = document.querySelector('meta[property="og:description"]');
    if(description && site.metaDescription) description.setAttribute('content', site.metaDescription);
    if(ogTitle && site.metaTitle) ogTitle.setAttribute('content', site.metaTitle);
    if(ogDescription && site.metaDescription) ogDescription.setAttribute('content', site.metaDescription);

    // Main cover picture (full-bleed photo background). Blank = the theme gradient.
    const coverImage = (settings.coverImage || '').trim();
    const hero = document.getElementById('home');
    if(coverImage){
      hero.style.backgroundImage = `linear-gradient(var(--hero-overlay-top), var(--hero-overlay-bottom)), url("${coverImage}")`;
    }else{
      hero.style.backgroundImage = 'radial-gradient(circle at 50% 18%, var(--sunset-1) 0%, var(--sunset-2) 32%, var(--sunset-3) 58%, var(--dusk-1) 78%, var(--dusk-2) 100%)';
    }

    // Browser-side share image setting. Social apps can cache previews, so the static
    // <head> value remains the fallback for crawlers that do not execute JavaScript.
    const seo = settings.seo || {};
    const siteUrl = ((seo.siteUrl || '').trim().replace(/\/+$/, '')) || window.location.origin;
    const pageUrl = siteUrl + '/';
    const shareImage = settings.shareImage || '/images/southern-star-logo.png';
    const absoluteShareImage = new URL(shareImage, pageUrl).href;
    // Browser-tab / home-screen icon: swap in the picture chosen in admin (if any)
    if(settings.siteIcon){
      const iconUrl = new URL(settings.siteIcon, pageUrl).href;
      document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(l => l.remove());
      [['icon', null], ['apple-touch-icon', null], ['shortcut icon', null]].forEach(([rel]) => {
        const l = document.createElement('link'); l.rel = rel; l.href = iconUrl; document.head.appendChild(l);
      });
    }
    const ogImage = document.querySelector('meta[property="og:image"]');
    const twitterImage = document.querySelector('meta[name="twitter:image"]');
    if(ogImage) ogImage.setAttribute('content', absoluteShareImage);
    if(twitterImage) twitterImage.setAttribute('content', absoluteShareImage);

    // Canonical address, share-card title/description, and Google's structured Event data.
    const setMeta = (sel, attr, value) => { const el = document.querySelector(sel); if(el && value) el.setAttribute(attr, value); };
    setMeta('link[rel="canonical"]', 'href', pageUrl);
    setMeta('meta[property="og:url"]', 'content', pageUrl);
    setMeta('meta[name="twitter:title"]', 'content', site.metaTitle);
    setMeta('meta[name="twitter:description"]', 'content', site.metaDescription);
    const eventData = buildStructuredData(data, pageUrl, absoluteShareImage);
    let ld = document.getElementById('structuredData');
    if(eventData){
      if(!ld){ ld = document.createElement('script'); ld.type = 'application/ld+json'; ld.id = 'structuredData'; document.head.appendChild(ld); }
      ld.textContent = JSON.stringify(eventData);
    }else if(ld){ ld.remove(); }

    // Admin-editable section headings and buttons.
    const text = (id, value) => {
      const el = document.getElementById(id);
      if(el && value) el.textContent = value;
    };
    text('lineupKicker', site.lineupKicker);
    text('lineupTitle', site.lineupTitle);
    text('scheduleKicker', site.scheduleKicker || `${data.hero.date} · ${data.hero.venue}`);
    text('scheduleTitle', site.scheduleTitle);
    text('ticketsKicker', site.ticketsKicker);
    text('ticketsTitle', site.ticketsTitle);
    text('faqKicker', site.faqKicker);
    text('faqTitle', site.faqTitle);

    // Hero — the logo artwork is the star here, with an admin-selectable entrance animation.
    const logoSrc = settings.heroLogo || '/images/southern-star-logo.png';
    const animOption = settings.heroAnimation || 'pop';
    const animSeconds = Number(settings.heroAnimationSeconds) || 1.1;
    root.setProperty('--hero-anim-duration', animSeconds + 's');
    const heroAltText = `${data.hero.title} — ${data.hero.subtitle}`;
    document.getElementById('heroContent').innerHTML = `
      <p class="presents">${esc(data.hero.presents)}</p>
      <h1 class="sr-only">${esc(heroAltText)}</h1>
      <img src="${esc(logoSrc)}" alt="${esc(heroAltText)}" class="hero-logo anim-${esc(animOption)}">
      <p class="hero-meta">${esc(data.hero.date)}<span class="dot">★</span>${esc(data.hero.venue)}<span class="dot">★</span>${esc(data.hero.city)}</p>
      ${layout.visible.has('tickets') ? `<a href="#tickets" class="btn btn-primary">${esc(site.heroPrimaryButton || 'Get Tickets')}</a>` : ''}
      ${layout.visible.has('lineup') ? `<a href="#lineup" class="btn btn-outline"${layout.visible.has('tickets') ? ' style="margin-left:14px;"' : ''}>${esc(site.heroSecondaryButton || 'See Lineup')}</a>` : ''}
    `;

    // About
    const stats = data.about.stats.map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('');
    const paras = data.about.paragraphs.map(p => `<p>${esc(p)}</p>`).join('');
    const vraw = String(data.about.videoId || '').trim();
    const vm = /(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/.exec(vraw);
    const vfRaw = String(data.about.videoFile || '').trim();
    const aboutFile = (/^(\/|https?:\/\/)/i.test(vfRaw) && /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(vfRaw)) ? vfRaw : '';
    const posterRaw = String(data.about.videoPoster || '').trim();
    const aboutPoster = /^(\/|https?:\/\/)/i.test(posterRaw) ? posterRaw : '';
    const aboutVid = vm ? vm[1] : (/^[A-Za-z0-9_-]{11}$/.test(vraw) ? vraw : '');
    document.getElementById('aboutContent').innerHTML = `
      <div class="about-text">
        <span class="about-kicker">${esc(data.about.kicker)}</span>
        ${paras}
        <div class="stat-row">${stats}</div>
      </div>
      ${aboutFile ? `<div class="about-video"><video controls playsinline preload="metadata"${aboutPoster ? ` poster="${esc(aboutPoster)}"` : ''} src="${esc(aboutFile)}">Your browser can't play this video.</video></div>` : aboutVid ? `<div class="about-video"><iframe src="https://www.youtube.com/embed/${esc(aboutVid)}" title="Southern Star Festival video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>` : (data.about.photo ? `<div class="about-photo"><img src="${esc(data.about.photo)}" alt="Festival photo"></div>` : '')}
    `;

    // Lineup
    document.getElementById('lineupGrid').innerHTML = data.lineup.map(l => `
      <div class="lineup-card"><div class="slot">${esc(l.slot)}</div><div class="tba">${esc(l.name)}</div></div>
    `).join('');
    document.getElementById('lineupNote').textContent = data.lineupNote;

    // Schedule
    document.getElementById('scheduleList').innerHTML = data.schedule.map(s => `
      <div class="schedule-item"><div class="schedule-time">${esc(s.time)}</div><div class="schedule-what"><b>${esc(s.title)}</b><span>${esc(s.desc)}</span></div></div>
    `).join('');

    // Tickets — our own styled buttons; Universe's script turns the click into a pop-up checkout
    const uni = data.universe || {};
    const link = universeTicketLink(uni, data.settings && data.settings.colors);
    const ICON_TICKET = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-2.5a2.5 2.5 0 0 0 0-5V7zm13 .5h-2v2h2v-2zm0 4h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>';
    const ICONS = {
      lock:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4V7z"/></svg>',
      qr:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h3v3h-3v-3zm5 0h3v3h-3v-3zm-5 5h3v3h-3v-3zm5 0h3v3h-3v-3z"/></svg>',
      phone:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm4 18a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM8 5v11h8V5H8z"/></svg>'
    };
    const ticketAttrs = link.href ? `href="${esc(link.href)}" target="_blank" rel="noopener noreferrer"` : 'href="#tickets" class="disabled" aria-disabled="true"';
    document.getElementById('ticketGrid').innerHTML = data.tickets.map(t => `
      <div class="ticket-card${t.featured ? ' featured' : ''}">
        ${t.badge ? `<span class="ticket-badge">${esc(t.badge)}</span>` : ''}
        <div class="ticket-main">
          <div class="ticket-name">${esc(t.name)}</div>
          <div class="ticket-desc">${esc(t.desc)}</div>
        </div>
        <div class="ticket-stub">
          <div class="ticket-price">${esc(t.price)}<span> ${esc(t.unit)}</span></div>
          <a class="ticket-btn${link.href ? '' : ' disabled'}" ${link.href ? ticketAttrs : 'href="#tickets" aria-disabled="true"'}>${ICON_TICKET}<span>${esc(link.href ? (t.cta || 'Get Tickets') : 'Coming soon')}</span></a>
        </div>
      </div>
    `).join('');

    // Big buy band
    const cn = document.getElementById('checkoutNote');
    cn.textContent = site.checkoutNote || ''; cn.hidden = !site.checkoutNote;
    const buyBtn = document.getElementById('buyButton');
    text('buyHeading', site.buyHeading || 'Ready to join us?');
    text('buyText', site.buyText || 'Grab your tickets and get ready for a day of music and BBQ.');
    buyBtn.innerHTML = ICON_TICKET + '<span></span>';
    buyBtn.lastChild.textContent = link.href ? (site.buyButton || 'Get Tickets') : 'Tickets coming soon';
    if(link.href){
      buyBtn.href = link.href; buyBtn.target = '_blank'; buyBtn.rel = 'noopener noreferrer'; buyBtn.classList.remove('disabled');
    } else { buyBtn.classList.add('disabled'); buyBtn.setAttribute('aria-disabled','true'); }
    const perks = (Array.isArray(site.buyPerks) && site.buyPerks.length) ? site.buyPerks
      : ['Secure checkout','QR tickets sent by email','Just show your phone at the gate'];
    const perkIcons = [ICONS.lock, ICONS.qr, ICONS.phone];
    document.getElementById('buyPerks').innerHTML = perks.map((p,i) => `<li>${perkIcons[i % 3]}<span>${esc(typeof p === 'string' ? p : (p.text || p.perk || ''))}</span></li>`).join('');

    // Load Universe's script once so clicks open the checkout pop-up on this page
    if(link.isUniverse && !window.$u && !document.getElementById('universeEmbed')){
      const sc = document.createElement('script');
      sc.id = 'universeEmbed'; sc.async = true; sc.src = 'https://www.universe.com/embed2.js';
      document.body.appendChild(sc);
    }

    // Advanced: show a pasted embed instead (only if "useEmbed" is switched on)
    const checkoutEl = document.getElementById('universeCheckout');
    if(uni.useEmbed && uni.embedCode && uni.embedCode.trim()){
      checkoutEl.hidden = false;
      checkoutEl.innerHTML = uni.embedCode;
      Array.from(checkoutEl.querySelectorAll('script')).forEach(old => {
        const s2 = document.createElement('script');
        Array.from(old.attributes).forEach(a => s2.setAttribute(a.name, a.value));
        s2.textContent = old.textContent;
        old.parentNode.replaceChild(s2, old);
      });
    } else { checkoutEl.hidden = true; checkoutEl.innerHTML = ''; }
    document.getElementById('feeNote').textContent = uni.feeNote || 'Ticketing powered by Universe';

    // Contact
    const ct = data.contact || {};
    text('contactKicker', ct.kicker); text('contactTitle', ct.title);
    const CI = {
      mail:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>',
      star:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
      store:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9v2H3V9zm1 4h16v8h-6v-5h-4v5H4v-8z"/></svg>',
      flame:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"/></svg>'
    };
    const emailAddr = (ct.email || '').trim();
    const emailBox = document.getElementById('contactEmail');
    emailBox.hidden = !emailAddr;
    if(emailAddr){
      emailBox.innerHTML = `<span class="ce-label">${esc(ct.emailLabel || 'Questions? Email us anytime')}</span><a href="mailto:${esc(emailAddr)}">${CI.mail}<span>${esc(emailAddr)}</span></a>`;
    }
    document.getElementById('contactGrid').innerHTML = (ct.cards || []).filter(c => c && c.title && c.link).map((c, i) => {
      const href = safeLink(c.link);
      const ext = /^https?:/i.test(href) || /\.pdf($|\?)/i.test(href);
      const icon = [CI.star, CI.store, CI.flame][i % 3];
      return `<div class="contact-card"><div class="cc-icon">${icon}</div><h3>${esc(c.title)}</h3><p>${esc(c.desc || '')}</p><a class="ticket-btn" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ''}><span>${esc(c.button || 'Learn More')}</span></a></div>`;
    }).join('');

    // Location
    document.getElementById('locationInfo').innerHTML = `
      <b>${esc(data.location.title)}</b>
      ${data.location.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}
      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.location.mapQuery)}"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-outline" style="border-color:var(--maroon);color:var(--maroon);">${esc(site.directionsButtonText || 'Get Directions')}</a>
    `;
    document.getElementById('mapFrame').innerHTML = `<iframe src="https://maps.google.com/maps?q=${encodeURIComponent(data.location.mapQuery)}&t=&z=11&ie=UTF8&iwloc=&output=embed" title="Map" loading="lazy"></iframe>`;

    // FAQ
    document.getElementById('faqList').innerHTML = data.faq.map((f, i) => `
      <div class="faq-item${i === 0 ? ' open' : ''}">
        <button class="faq-q">${esc(f.q)} <span class="icon">+</span></button>
        <div class="faq-a"><p>${esc(f.a)}</p></div>
      </div>
    `).join('');

    // Footer
    document.getElementById('footerContent').innerHTML = `
      <div class="display">${esc(site.footerName || 'Southern Star Festival')}</div>
      <p style="opacity:0.85;">${esc(data.footer.tagline)}</p>
      <div class="foot-links">
        ${layout.tabs.filter(t => t.id !== 'home').map(t => `<a href="#${esc(t.id)}">${esc(t.label)}</a>`).join('')}
      </div>
      ${(data.socials || []).filter(link => link.label && link.url).length ? `<div class="social-links">
        ${(data.socials || []).filter(link => link.label && link.url).map(socialLinkHtml).join('')}
      </div>` : ''}
      <p class="fine">${esc(data.footer.note)}</p>
    `;

    initTracking(data);
    initInteractions();
  }

  function initInteractions(){
    // Scrollspy
    const navLinks = Array.from(document.querySelectorAll('.tabnav a'));
    const sections = navLinks.map(l => document.getElementById((l.getAttribute('href') || '').slice(1)));
    function onScroll(){
      let current = sections[0];
      const y = window.scrollY + 120;
      sections.forEach(sec => { if(sec && !sec.hidden && sec.offsetTop <= y) current = sec; });
      navLinks.forEach(l => l.classList.toggle('active', !!current && l.getAttribute('href') === '#' + current.id));
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();

    // FAQ accordion
    document.querySelectorAll('.faq-item').forEach(item => {
      const q = item.querySelector('.faq-q');
      const a = item.querySelector('.faq-a');
      if(item.classList.contains('open')) a.style.maxHeight = a.scrollHeight + 'px';
      q.addEventListener('click', () => {
        const isOpen = item.classList.contains('open');
        document.querySelectorAll('.faq-item').forEach(i => { i.classList.remove('open'); i.querySelector('.faq-a').style.maxHeight = null; });
        if(!isOpen){ item.classList.add('open'); a.style.maxHeight = a.scrollHeight + 'px'; }
      });
    });
  }

  // Load the single source of truth edited through /admin/.
  fetch('content.json?_=' + Date.now())
    .then(r => {
      if(!r.ok) throw new Error('Could not load content.json');
      return r.json();
    })
    .then(render)
    .catch(err => {
      console.error(err);
      document.getElementById('heroContent').innerHTML = `
        <p class="presents">Southern Star Festival</p>
        <img src="/images/southern-star-logo.png" alt="Southern Star Festival" class="hero-logo anim-none">
        <p class="hero-sub">Festival information is temporarily unavailable.</p>
      `;
    });
</script>

</body>
</html>
